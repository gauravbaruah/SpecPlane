# ============================================
# FOUNDATION: Analytics Conventions
# ============================================
meta:
  id: "foundation.analytics_conventions"
  purpose: "Define how product analytics events are specified, implemented, and traced — ensuring a single source of truth and clear separation from observability"
  level: "foundation"
  owner: ""
  tags: ["analytics", "events", "observability", "product-metrics", "traceability"]
  status: "active"
  review_state: "approved"
  version: "0.2.0"
  introduced_in: "0.6.0"
  last_updated: "2026-02-26"

changelog:
  - date: "2026-02-26"
    author: ""
    summary: "v0.2.0 — single-source-of-truth, capability vs component ownership, analytics vs observability, roll-up to success_metrics"
    breaking: false
  - date: "2026-02-26"
    author: ""
