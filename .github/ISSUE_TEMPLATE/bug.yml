name: Bug
description: The try path or pip install specplane failed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this was the five-minute try path, start from [docs/try.md](https://github.com/gauravbaruah/SpecPlane/blob/main/docs/try.md).
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Python
      placeholder: macOS 15, Python 3.12
    validations:
      required: true
