meta:
  id: "capability.specplane_check_sync"
  purpose: "Fail when a named behavior moved and the live spec did not"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "check_sync"]
  last_updated: "2026-10-06"
  status: "planned"
  version: "1.9.1"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-06"
    author: "promote_change"
    summary: "resolve_change is OPEN, PROMOTED, MIXED, or MISSING. PARTIAL is an archived packet whose live specs do not match it. --change works on OPEN or PROMOTED. Default coverage also accepts a promoted packet whose archive path is in this changed-set. MIXED and PARTIAL fail. Old archives not in the diff do not cover. Do not treat a promoted HEAD as uncovered."
    breaking: false
  - date: "2026-10-02"
    author: "practitioner_brief"
    summary: "check_sync --change fails when that change declares a sensor with no run.unittest, run.argv, or test:. The line names the sensor and the bind to add. It does not execute the English. Default check_sync without --change does not fail for unbound sentences elsewhere."
    breaking: false
  - date: "2026-10-01"
    author: "receipt_next_step"
    summary: "An uncovered failure names the ids and says to put them on an open change, then check_sync again. A pass with declared sensors says to run them. A Phase 1 pass says Phase 1 is valid and an empty impact list is a warning."
    breaking: false
  - date: "2026-10-01"
    author: "command_receipts"
    summary: "check_sync ends with one line. A failure names the count. A Phase 1 pass says no impact is declared. A pass with declared sensors says they were not executed."
    breaking: false
  - date: "2026-10-01"
    author: "effective_context"
    summary: "Each declared sensor shows its evidence and status UNVERIFIED. check_sync does not run the bind."
    breaking: false
  - date: "2026-09-28"
    author: "eval_papercuts"
    summary: "A mapped file under a nested spec root fails coverage. An id named on the scoped change, including one not on disk yet, is in-flight known and is not live."
    breaking: false
  - date: "2026-09-28"
    author: "ci_compose"
    summary: "A paste-in pull-request workflow may call this command on the default changed-set, and again with --change when a change folder is in the diff. The command still does not execute sensors."
    breaking: false
  - date: "2026-09-28"
    author: "mcp_and_sync_speech"
    summary: "When coverage fails on uncovered ids, stdout names those ids and the next commands. It does not invent a slug, and it still does not stamp live."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Default changed-set includes component ids from declared realization.paths. Unmapped app files are advisory. Still does not parse source or print verified."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Does not execute sensors. Compose with run; do not absorb it or add --run-sensors."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "A — optional --change scopes coverage; stdout is coverage/sensors/behavior; a pass is declared coverage, not behavioral agreement. After implement, named --changed-ids when realization files moved."
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Q115+Q116 — default changed-set includes untracked specs YAML; Phase 1 (no join edges) is advisory, not fail"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "v1 checker: id coverage vs open change; does not parse application source"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Phase 1 — checker that can fail; maker is not the checker"
    breaking: false

responsibilities:
  - "Fail when a named live promise moved in code and the live spec (plus open delta) did not"
  - "Fail an empty blast on a behavior-changing diff"
  - "Treat declared / observed / verified as a retrieve-time join, not new YAML fields (Q97)"
  - "Never auto-write live to match code"
  - "Same coding session must not grade itself"
  - "Optional --change scopes coverage to that folder; another open change listing the same ids does not satisfy"
  - "A coverage pass is declared coverage, not behavioral agreement"
  - "Default changed-set is spec YAML plus component ids whose declared realization.paths match a changed file. --changed-ids overrides that set."
  - "An unmapped changed app file is advisory and does not fail coverage. A missing declared path does not fail coverage."
  - "A mapped file whose path is relative to a spec root below the git toplevel is in the default changed-set and fails coverage when no open change covers that component."
  - "When --change is set, an id that folder names and that is not on disk yet is in-flight known. It must be covered by that slug. It is not live."
  - "Does not execute sensors. Compose with capability.specplane_run; do not absorb it."
  - "Each declared sensor shows its evidence and status UNVERIFIED. check_sync does not run the bind."
  - "check_sync ends with one line. An uncovered failure names the ids and says to put them on an open change, then check_sync again. A pass with declared sensors says to run them. A Phase 1 pass says Phase 1 is valid and an empty impact list is a warning."
  - "check_sync --change fails when that change declares a sensor with no run.unittest, run.argv, or test:. The line names the sensor and the bind to add. It does not execute the English. A change with no sensors stays a coverage check. Default check_sync without --change does not fail for unbound sentences elsewhere."
  - "resolve_change is OPEN, PROMOTED, MIXED, or MISSING. PARTIAL is an archived packet whose live specs do not match it. --change works on OPEN or PROMOTED. Default coverage also accepts a promoted packet whose archive path is in this changed-set. MIXED and PARTIAL fail. Old archives not in the diff do not cover. Do not treat a promoted HEAD as uncovered."

flows:
  - "After implement: check_sync --change <slug> --changed-ids against live + that open delta"
  - "On a merge-shaped invocation: fail the PR-shaped check when the spec rule would only nag"
  - "Surface DECISION REQUIRED from blast rather than resolving it"

business_value:
  user_outcome: "A merge does not ship a third graph as if it were live"
  objective: "Kill test — an hour a week on fat agent PRs; spec rule becomes a fail, not a nag"
  revenue_dependency: "medium"
  strategic_priority: "core"

constraints:
  legal: []
  security:
    - "Local comparison of specs, changes/, and named behavior claims — no hosted check in this slice"
  ux:
    - "Fail closed on moved named behavior and on empty blast"
    - "Default changed-set = git diff (staged+unstaged) plus untracked specs/**/*.yaml, excluding specs/changes/, plus component ids for declared realization.paths hits. --changed-ids is an explicit override and does not add mapped ids."
    - "Unmapped changed app files print as advisory and do not fail coverage. Missing declared paths do not fail coverage."
    - "Phase-1-shaped id (no realized_by, uses, or component implements): do not fail empty_blast or uncovered when the open change names no other ids; print phase1_advisory. Fail and name the other ids when the open change names ids the live graph does not reach."
    - "Ids that have join edges still need an open change covering the id; empty blast still fails."
    - "Coverage = open change promise_ids (or a component that implements a promised capability). Does not parse application source."
    - "Optional --change <slug> scopes coverage to that folder. Default without --change remains any-open-change."
    - "Stdout bands: coverage / sensors declared|missing (must lines not executed) / behavior unverified. Never sensors executed. Never a bare result: pass that sounds like behavior."
    - "Do not execute run binds. Do not add --run-sensors. Evidence of a bound check is the run command."
    - "Do not silently pick spec vs code"
    - "When decision_required and at least one id is uncovered, stdout names those ids and the resolve steps: retrieve each id, open or extend the change folder, then check_sync again. If --change was passed, name that slug. If it was not, do not invent one."
    - "Unknown change, unknown ids, empty blast, and Phase 1 advisory keep their existing lines and do not get the uncovered recipe. No --strict."
    - "A paste-in pull-request workflow may call this command. A required GitHub check is not a product claim."
    - "Changed files are compared to declared realization.paths as paths relative to the config dir, including when that dir sits below the git toplevel."
    - "With --change, an id in that folder's promise_ids or delta ADDED that is not a live file is in-flight known and must be covered by that slug. retrieve does not treat it as live. The same id with no --change, or with a different slug, stays unknown."
  data_classification: "internal"

success_metrics:
  primary: "moved_behavior_fails"
  targets:
    moved_behavior_fails: "named behavior moved, live spec unchanged → non-zero exit"
    empty_blast_fails: "linked id (has join edges) with empty blast → non-zero exit; Phase 1 empty blast is advisory"
    no_autowrite_live: "check_sync never stamps live"
  derived_from: {}

roadmap:
  phase: "first kernel slice"
  priority: "P0"
  depends_on:
    - "capability.specplane_retrieve"
    - "capability.specplane_blast"
    - "capability.specplane_change_folders"
  enables: []

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_check_sync"
    - "component.mcp_stdio"
