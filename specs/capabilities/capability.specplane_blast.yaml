meta:
  id: "capability.specplane_blast"
  purpose: "Compute what a change hits so a small edit cannot silently break the rest"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "blast"]
  last_updated: "2026-10-02"
  status: "planned"
  version: "1.4.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-02"
    author: "practitioner_brief"
    summary: "An empty blast stays a warning for a Phase 1 id that names nothing else. It fails when the open change names other ids and the live graph has no path to them. The failure names those ids."
    breaking: false
  - date: "2026-10-01"
    author: "command_receipts"
    summary: "An empty blast ends with one line: no declared impact does not mean the code is unaffected. A blast that names impact does not add that line."
    breaking: false
  - date: "2026-09-28"
    author: "projection_payload"
    summary: "Impact includes declared flow stages and outcomes, and declared contract data_models. blast buckets stay."
    breaking: false
  - date: "2026-09-25"
    author: "kernel-slice"
    summary: "impact explains the same join-key closure with paths and projects it as system, product, quality, governance, and ownership. blast buckets stay."
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "v1: component-dep closure; foundations are terminal"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Phase 1 — computed blast; empty blast fails check_sync; DECISION REQUIRED when sides disagree"
    breaking: false

responsibilities:
  - "Compute blast from join-key edges (implements, depended_on_by, open delta ids) — not a hand-written essay"
  - "Name the change, the affects tree, and whether a human must decide"
  - "Return full impact in this slice; do not silently drop rows (Q94 / Q98 interruption policy is a later ADR)"
  - "When intent and code disagree, emit DECISION REQUIRED — SpecPlane does not pick a side"
  - "An empty blast stays a warning for a Phase 1 id that names nothing else. It fails when the open change names other ids and the live graph has no path to them. The failure names those ids."
  - "impact explains that same closure with a path for each affected id, including an open change folder and no git diff"
  - "Project the subgraph as system, product, quality, governance, and ownership. Absence of a field stays not represented"

flows:
  - "blast a named id"
  - "impact a named id or an open change folder, with no git diff"
  - "blast a behavior-changing diff so check_sync can refuse an empty blast"

business_value:
  user_outcome: "A lead sees consequences of a small change in about five seconds"
  objective: "Job 3 — change something small without breaking the rest; job 2 fat-PR review"
  revenue_dependency: "medium"
  strategic_priority: "core"

constraints:
  legal: []
  security:
    - "Local graph only"
  ux:
    - "Five-second readable: change, affects tree, DECISION REQUIRED when ambiguity exists"
    - "If it needs a 1,500-word preamble, the command is not simple enough yet"
    - "Empty blast on a linked id is a fail for check_sync, not a pass. A Phase 1 id that names nothing else stays a warning. When the open change names other ids the live graph does not reach, the failure names those ids."
    - "An empty blast ends with one line: no declared impact does not mean the code is unaffected. A blast that names impact does not add that line."
    - "v1: recursive component depends_on/depended_on_by; a used foundation is listed then STOP (do not follow used_by)"
    - "impact is one subgraph and five projections. blast buckets stay the check_sync tree"
    - "Declared flow stages and outcomes appear on the product projection. Declared contract data_models appear on the quality projection."
    - "A missing owner, governed concern, or verification stays not represented"
  data_classification: "internal"

success_metrics:
  primary: "five_second_readable_blast"
  targets:
    five_second_readable_blast: "fixture output shows change + affects tree without a lecture"
    decision_required: "intent vs code disagreement is labeled DECISION REQUIRED"
    empty_blast_fails_check: "a linked id with an empty blast does not pass check_sync; a Phase 1 id that names other unreached ids fails and names them"
    explainable_impact: "a change folder with no diff names each affected id and the path that included it"
  derived_from: {}

roadmap:
  phase: "first kernel slice"
  priority: "P0"
  depends_on:
    - "capability.specplane_retrieve"
  enables:
    - "capability.specplane_check_sync"

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_blast"
    - "component.mcp_stdio"
