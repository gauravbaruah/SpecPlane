meta:
  id: "capability.specplane_init"
  purpose: "Copy the kit into a product repo and create empty specs/ folders in one command"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "init"]
  last_updated: "2026-10-06"
  status: "planned"
  version: "1.13.1"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-06"
    author: "promote_change"
    summary: "Consuming AGENTS.md and the dialect say promote is the change and accept --ids makes named inferred ids live."
    breaking: false
  - date: "2026-10-06"
    author: "intent_and_reuse"
    summary: "Consuming AGENTS.md says a new capability waits on meaning, then on reuse, before YAML or code."
    breaking: false
  - date: "2026-10-05"
    author: "oss_hygiene"
    summary: "Init still does not write a workflow, does not copy kernel specs/, and does not publish. A published specplane package may run init. The public try path stays a clone plus examples/tiny-saas."
    breaking: false
  - date: "2026-10-05"
    author: "minimal_dialect"
    summary: "The kit includes specplane/dialect.md, an index of nouns, verbs, and the loops that join them. A change stays off the live file until the human accepts and the agent promotes. Init still copies specplane/ and does not copy this repo's specs/ or write a workflow."
    breaking: false
  - date: "2026-10-05"
    author: "must_to_bind"
    summary: "Consuming AGENTS.md and the copied implement skill say to bind an existing check (run.unittest or run.argv). Do not invent a test so SpecPlane has something to run. Do not parse test_strategy. Unbound must: is not_run on run, not a pass and not a certificate."
    breaking: false
  - date: "2026-10-02"
    author: "specplane_package"
    summary: "Init does not publish. A published specplane package may run init. There is no npx package. specplane uninstall removes the kit copy and leaves specs/ in place. It does not remove the specplane command."
    breaking: false
  - date: "2026-09-28"
    author: "init_journey"
    summary: "A failed copy names the kit folders to delete and leaves specs/ alone. --force replaces the kit, keeps specs/, and deletes generated .specplane/view/. There is no uninstall command."
    breaking: false
  - date: "2026-09-28"
    author: "viewer_projections"
    summary: "Init copies view.py and the viewer/ tree with the CLI. --kit-only copies neither."
    breaking: false
  - date: "2026-09-28"
    author: "eval_papercuts"
    summary: "Init copies ci_gate.py and ignores generated **/.specplane/view/. It still does not write a workflow or a git hook."
    breaking: false
  - date: "2026-09-28"
    author: "ci_compose"
    summary: "A paste-in pull-request workflow may call validate, check_sync, and run. Init still does not write that file, and it is not a required GitHub check."
    breaking: false
  - date: "2026-09-28"
    author: "try_path_view"
    summary: "The try path ends on the local viewer blast for the tiny-saas auth id. Init behavior is unchanged."
    breaking: false
  - date: "2026-09-28"
    author: "readme_onramp"
    summary: "README, try, and use-in-your-project show the install path and specplane mcp. Init behavior is unchanged."
    breaking: false
  - date: "2026-09-27"
    author: "kernel-slice"
    summary: "Added an init flowchart and an init sequence diagram"
    breaking: false
  - date: "2026-09-25"
    author: "kernel-slice"
    summary: "Copied CLI siblings include impact.py"
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Consuming AGENTS.md points brownfield at specplane-infer, not at a scan CLI"
    breaking: false
  - date: "2026-09-18"
    author: "kernel-slice"
    summary: "Init may run from uvx --from git+ this repo; the wheel bundles the kit. PyPI/npx still unpublished."
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Phase 1 — v0 init is a copier plus empty specs/ dirs, not npx or CI"
    breaking: false

responsibilities:
  - "Copy specplane/, SpecPlane skills, and Cursor rules into a destination repo"
  - "Optionally copy the local kernel CLI (cli.py and siblings), never this repo's specs/"
  - "Create empty specs/capabilities, foundations, containers, components, changes"
  - "Write or append a consuming AGENTS.md; do not replace an existing project AGENTS.md"
  - "Refuse dest equal to the kit root; do not write GitHub Actions or hooks"
  - "Consuming AGENTS.md points an existing repo at specplane-infer. Greenfield stays bootstrap. There is no scan CLI."
  - "Consuming AGENTS.md and the copied implement skill say: if this change already has a check, bind it (run.unittest or run.argv). Do not invent a test so SpecPlane has something to run. Do not parse test_strategy. Unbound must: is not_run on run, not a pass and not a certificate. English must: stays enough when there is no check yet."
  - "Consuming AGENTS.md says a new capability waits on meaning, then on reuse, before YAML or code."
  - "The kit includes specplane/dialect.md, an index of nouns, verbs, and the loops that join them. A change stays off the live file until the human accepts and the agent promotes. Consuming AGENTS, applicable first-orientation, and the bootstrap and author skills point at that card."
  - "Consuming AGENTS.md and the dialect say promote is the change and accept --ids makes named inferred ids live."

flows:
  - id: init_product_repo
    kinds: [journey]
    goal: "A product repo has the kit and an empty specs/ tree"
    actors:
      primary: developer
    entry:
      trigger: "developer runs specplane init from uvx --from git+ this repo, or from a SpecPlane clone"
      preconditions:
        - "destination is not the kit root"
    stages:
      - choose_destination
      - copy_kit
      - create_empty_specs_dirs
      - write_or_append_agents
    outcomes:
      success:
        - "dest has specplane/, skills, rules, and empty specs/ folders"
        - "kernel specs/ from this repo are not copied"
    exceptions:
      - "dest already contains specplane/ and --force was not passed"
    recovery:
      - "If init fails after copying some files, it does not roll back. Delete specplane/, the specplane-* skills and rules, tools/specplane/, and specplane.config.json, then run init again. Leave specs/ alone."
      - "--force replaces the kit copy and does not keep a previous kit file the new copy no longer has. It does not delete or empty specs/. It deletes generated .specplane/view/ so the next specplane view rebuilds. It does not start the viewer."
  - "Re-run without --force when specplane/ already exists → fail"
  - "Ask the agent for a Phase 1 capability after folders exist"

business_value:
  user_outcome: "A product repo has the kit and an empty specs/ tree without hand-rsync"
  objective: "Time-to-first-win; on-ramp for the agent ritual"
  revenue_dependency: "low"
  strategic_priority: "growth"

constraints:
  legal: []
  security:
    - "Local filesystem copy only"
  ux:
    - "Does not copy kernel specs/ into the dest"
    - "Does not write .github/workflows or git hooks"
    - "A paste-in pull-request workflow may call validate, check_sync, and run. Init does not write that file. It is not a required GitHub check."
    - "Does not invent an example capability (bootstrap does that)"
    - "Does not infer or scan the destination. Brownfield mapping is the specplane-infer skill."
    - "Init does not publish. A published specplane package may run init. There is no npx package."
    - "The public try path is a clone of this repo plus examples/tiny-saas. It is not the obtaining command."
    - "uvx --from git+ this repo may run init because the installed wheel bundles the kit"
    - "Copied CLI siblings include impact.py, ci_gate.py, view.py, and the viewer/ tree. --kit-only copies neither the CLI nor the viewer."
    - "Appends **/.specplane/view/ to the destination .gitignore when that line is missing. Does not ignore every path under .specplane/."
    - "No interactive agent-picker"
    - "A failed copy does not roll back. It names specplane/, the specplane-* skills and rules, tools/specplane/, and specplane.config.json, and says to run init again. It says to leave specs/ alone."
    - "--force replaces the kit copy. It does not delete or empty specs/. It deletes generated .specplane/view/ and does not start the viewer. specplane uninstall removes the kit copy and leaves specs/ in place. It does not remove the specplane command."
  data_classification: "internal"

success_metrics:
  primary: "kit_without_kernel_specs"
  targets:
    kit_without_kernel_specs: "dest has specplane/ and skills; no copied kernel capability YAML"
    empty_specs_dirs: "five specs/ folders exist with no example capability"
  derived_from: {}

roadmap:
  phase: "after agent ritual"
  priority: "P1"
  depends_on:
    - "capability.specplane_change_folders"
  enables: []

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_init"

diagrams:
  - type: "flowchart"
    title: "Init flow"
    description: "How init is started, when it refuses or fails, and what a ready destination receives"
    mermaid: |
      flowchart TD
        start[Developer runs init] --> how{Where is init run from?}
        how -->|Product repo| uvx["uvx --from git+ this repo specplane init"]
        how -->|SpecPlane clone| clone["cli.py init, or pip install -e . then specplane init"]
        uvx --> root{Destination is the kit root?}
        clone --> root
        root -->|Yes| refuse[Refuse]
        root -->|No| exists{specplane/ already exists?}
        exists -->|Yes, and --force was not passed| fail[Fail]
        exists -->|Yes, and --force| replace["Replace the kit. Keep specs/. Delete generated .specplane/view/"]
        exists -->|No| copy["Copy specplane/, skills, and Cursor rules"]
        replace --> copy
        copy --> cli["Optionally copy the local kernel CLI; never this repo's specs/"]
        cli --> dirs["Create empty specs/capabilities, foundations, containers, components, changes"]
        dirs --> agents["Write or append a consuming AGENTS.md"]
        agents --> ask[Ask the agent for a Phase 1 capability]
  - type: "sequence"
    title: "Init interaction"
    description: "Developer, init, and the destination repo: refuse, fail, or copy the kit and leave empty specs/ folders"
    mermaid: |
      sequenceDiagram
        actor Dev as Developer
        participant Init as specplane init
        participant Dest as Destination repo

        Dev->>Init: Run init from uvx --from git+ this repo, or from a SpecPlane clone
        alt Destination is the kit root
          Init-->>Dev: Refuse
        else specplane/ already exists and --force was not passed
          Init-->>Dev: Fail
        else Destination has no specplane/
          Init->>Dest: Copy specplane/, SpecPlane skills, and Cursor rules
          Init->>Dest: Optionally copy the local kernel CLI
          Note over Init,Dest: Never copy this repo's specs/. Do not write GitHub Actions or hooks.
          Init->>Dest: Create empty specs/capabilities, foundations, containers, components, and changes
          Note over Init,Dest: Do not invent an example capability
          Init->>Dest: Write or append a consuming AGENTS.md
          Note over Dest: Do not replace an existing project AGENTS.md. An existing repo is pointed at specplane-infer.
          Init-->>Dev: Kit and empty specs/ tree
          Note over Dev: Ask the agent for a Phase 1 capability after folders exist
        end
