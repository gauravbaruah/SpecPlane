meta:
  id: "capability.specplane_list_gaps"
  purpose: "Surface a kernel-generic gap queue: thin Phase 1, open changes, replaced leftovers, missing sensors, unpromoted inferred ids"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "mcp", "list_gaps"]
  last_updated: "2026-09-24"
  status: "planned"
  version: "1.2.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Advisory bucket inferred_unpromoted. Exit stays 0."
    breaking: false
  - date: "2026-09-18"
    author: "kernel-slice"
    summary: "L37 — CLI is source of truth; MCP wraps it. Kernel-generic gaps only (Q108); advisory exit 0 (Q109). H02 MCP-only superseded"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "H02 — list_gaps stays MCP-only; no CLI this slice"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Phase 1 — list_gaps as MCP tool wrapping the same kernel; not a coverage essay"
    breaking: false

responsibilities:
  - "List live capabilities with no join edges (Phase 1 thin)"
  - "List open change folders"
  - "List replaced leftovers"
  - "List open changes that have no success sensor (must: line)"
  - "List inferred ids that have not been promoted"
  - "Advisory only — not a fail-closed checker and not an LLM coverage essay"

flows:
  - "specplane list_gaps --spec-root specs"
  - "Agent calls the same function via MCP list_gaps"
  - "Weekly habit: what is still thin, open, leftover, unsensored, or inferred and unpromoted"

business_value:
  user_outcome: "Drift is a queue, not a lifestyle"
  objective: "Make leftover honesty visible without a viewer"
  revenue_dependency: "low"
  strategic_priority: "foundation"

constraints:
  legal: []
  security:
    - "Local spec root and changes/ only"
  ux:
    - "Ids and gap kind; no lecture"
    - "CLI is source of truth; MCP wraps the same kernel functions"
    - "Stdout is advisory (Q109). Exit 0 unless the command itself errors"
    - "No --bar=, no HIPAA, no application-source parse"
  data_classification: "internal"

success_metrics:
  primary: "gap_queue_visible"
  targets:
    gap_queue_visible: "open change missing a sensor appears; Phase 1 thin appears as advisory"
  derived_from: {}

roadmap:
  phase: "slice-1 list_gaps + thin MCP"
  priority: "P0"
  depends_on:
    - "capability.specplane_retrieve"
    - "capability.specplane_change_folders"
  enables: []

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_list_gaps"
    - "component.mcp_stdio"
