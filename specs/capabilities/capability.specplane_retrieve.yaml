meta:
  id: "capability.specplane_retrieve"
  purpose: "Return one live graph for an id, mark leftovers, and show the open delta"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "retrieve"]
  last_updated: "2026-10-02"
  status: "planned"
  version: "1.5.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-02"
    author: "practitioner_brief"
    summary: "When one open change names the id, the first slice is the live text with that change applied, labeled in-flight. The untouched live text follows it. The file on disk is not rewritten. Two open changes are not blended."
    breaking: false
  - date: "2026-10-01"
    author: "receipt_next_step"
    summary: "When an open change names the id, the retrieve line says that change is still open. Keep working in that folder, or accept it so retrieve shows one live graph."
    breaking: false
  - date: "2026-10-01"
    author: "effective_context"
    summary: "An open change stays labeled as the implementation context. Canonical synchronization stays pending. A Phase 1 id warns when no implementation relationships are declared."
    breaking: false
  - date: "2026-09-28"
    author: "projection_payload"
    summary: "Retrieve prints the spec path and declared diagrams. An inferred id keeps a declared slice and is not live."
    breaking: false
  - date: "2026-09-28"
    author: "demo_teeth"
    summary: "A capability retrieve prints authored legal, security, and ux constraint lists. It still omits business value, changelog, and data_classification."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "infer_promote — inferred is still never presented as live"
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "A — bit live is graph membership, not approval; stdout prints meta.review_state and meta.status next to bit"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Phase 1 — retrieve as the agent habit instead of read specs/"
    breaking: false

responsibilities:
  - "Default graph for an id is live — one live graph, not three"
  - "Mark leftovers as replaced so they stay visible and not default"
  - "Show the open in-flight change that points at this id"
  - "When one open change names the id, the first slice is the live text with that change applied, labeled in-flight and not accepted. The untouched live text follows it. The file on disk is not rewritten. Two open changes are not blended. Canonical synchronization stays pending until accept. A Phase 1 id warns that no implementation relationships are declared."
  - "Never present inferred as live"
  - "Join on capability.* / component.* / foundation.*"
  - "bit live is graph membership, not approval; print review_state and status next to bit"

flows:
  - "retrieve <id> for a messy capability"
  - "Agent calls retrieve instead of slurping specs/"
  - "Human asks what is promised now vs leftover vs open"

business_value:
  user_outcome: "A lead or agent sees what is live, leftover, and in-flight without reading every YAML file"
  objective: "Job 2 — review agent work without reading every file; keep the product from forking in the head"
  revenue_dependency: "medium"
  strategic_priority: "core"

constraints:
  legal: []
  security:
    - "Reads the local spec root and changes/ only"
  ux:
    - "Default answer is the live graph; leftovers and open delta are labeled, not mixed in as live"
    - "Stdout prints meta.review_state and meta.status next to bit; live still means graph membership, not approval"
    - "Skills and AGENTS.md call retrieve, not read specs/"
    - "An inferred id prints inferred (not live) on stderr and omits the live slice. It still prints the declared slice."
    - "Stdout includes the spec path and declared diagrams when the spec has them"
    - "Authored legal, security, and ux constraint lists are printed. Business value, changelog, and data_classification stay omitted. must: lines are not executed."
  data_classification: "internal"

success_metrics:
  primary: "one_live_graph"
  targets:
    one_live_graph: "messy capability returns exactly one live graph"
    leftovers_visible: "replaced ids are marked, not omitted and not default"
    open_delta_shown: "in-flight change for that id is listed"
  derived_from: {}

roadmap:
  phase: "first kernel slice"
  priority: "P0"
  depends_on:
    - "capability.specplane_validate"
    - "capability.specplane_change_folders"
  enables:
    - "capability.specplane_blast"
    - "capability.specplane_check_sync"
    - "capability.specplane_list_gaps"

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_retrieve"
    - "component.mcp_stdio"
