meta:
  id: "capability.specplane_run"
  purpose: "Invoke a check already bound to a how-well claim and record the exit as evidence"
  level: "capability"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "mcp", "run"]
  last_updated: "2026-10-02"
  status: "planned"
  version: "1.5.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-02"
    author: "practitioner_brief"
    summary: "run still does not execute English must:. No bind stays UNVERIFIED. Exit 0 when every row is not_run remains, and that receipt is not a coverage pass."
    breaking: false
  - date: "2026-10-01"
    author: "receipt_next_step"
    summary: "A passing run still does not certify the spec, and says the human step is to accept the change or keep editing. A failure says to read the failed sensor and fix that check."
    breaking: false
  - date: "2026-10-01"
    author: "command_receipts"
    summary: "run ends with one line. A pass does not certify the spec. No bind says no check was executed."
    breaking: false
  - date: "2026-10-01"
    author: "effective_context"
    summary: "A bound command that passes is VERIFIED. A failure is FAILED. An English must with no bind is UNVERIFIED. VERIFIED means the bound command passed."
    breaking: false
  - date: "2026-09-28"
    author: "ci_compose"
    summary: "A paste-in pull-request workflow may call run --change only for a change folder in that diff. English must: is still not a command."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "L3 join — run binds a success.yaml claim to an existing argv or unittest id and records the exit. Not a test runner. check_sync stays L1."
    breaking: false

responsibilities:
  - "run --change <slug> invokes only binds the user already owns: run.argv (a list of strings, no shell) and/or a unittest id (run.unittest, run.test, or test:)"
  - "English must: is the claim. No bind prints not_run. The sentence is never executed."
  - "evaluator: is a join. No run: prints not_run. Do not load a harness from that id."
  - "Exit 1 on an unknown or archived change, any fail, or any error. Exit 0 when every runnable bind passed, including when every row is not_run. That exit is not a coverage pass."
  - "Speech is evidence. Never certify that the implementation satisfies the spec."
  - "A bound command that passes is VERIFIED. A failure is FAILED. An English must with no bind is UNVERIFIED. VERIFIED means the bound command passed."
  - "run ends with one line. A passing run still does not certify the spec, and says the human step is to accept the change or keep editing. A failure says to read the failed sensor and fix that check. No bind says no check was executed."
  - "check_sync does not absorb this command. Compose with it; do not execute sensors there."

flows:
  - "After check_sync --change <slug>: run --change <slug>"
  - "Agent calls the same function via MCP run"
  - "A sensor with only must: prints not_run"

business_value:
  user_outcome: "A bound check's exit sits next to the claim, without SpecPlane becoming the test platform"
  objective: "Record evidence of checks the product already owns"
  revenue_dependency: "low"
  strategic_priority: "core"

constraints:
  legal: []
  security:
    - "cwd is the repo root (--repo or the process cwd). Inherit env. shell is false. Default timeout 120s per sensor."
    - "Do not execute English must: text. Do not parse application source. Do not infer a test."
  ux:
    - "Not a test runner, not a second CI, and not a replacement for pytest, Playwright, eval harnesses, cron, or GitHub Actions"
    - "A paste-in pull-request workflow may call run --change only for a change folder in that diff"
    - "Stdout is per-sensor pass | fail | not_run | error, then behavior: evidence. No bare result: pass as a certificate."
    - "Unknown or archived --change exits non-zero and invokes nothing"
    - "Do not measure capability success_metrics. Do not parse test_strategy into a command."
  data_classification: "internal"

success_metrics:
  primary: "bound_check_exit_recorded"
  targets:
    bound_check_exit_recorded: "a bound argv or unittest that exits 0 prints result: pass; a non-zero exit prints fail and the command exits 1"
    english_must_not_run: "a sensor with only must: prints not_run and does not execute the sentence"
  derived_from: {}

roadmap:
  phase: "how-well join"
  priority: "P0"
  depends_on:
    - "capability.specplane_change_folders"
    - "capability.specplane_check_sync"
  enables: []

realized_by:
  containers:
    - "container.specplane_tools"
  components:
    - "component.cli_run"
    - "component.mcp_stdio"
