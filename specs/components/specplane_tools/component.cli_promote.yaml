meta:
  id: "component.cli_promote"
  purpose: "Local promote command: apply an open change and archive it"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "promote"]
  last_updated: "2026-10-06"
  status: "draft"
  version: "1.0.1"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-06"
    author: "promote_change"
    summary: "promote <slug> applies the open change into live YAML, archives the folder, validates. Idempotent if already promoted. MIXED fails. CLI only. promote --ids is an error that names accept --ids."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "CLI promote --ids. Not an MCP tool. Does not parse application source."
    breaking: false

implements:
  - "capability.specplane_change_folders"

planning:
  user_flows:
    actions:
      - "promote <slug> --spec-root specs"
    success:
      - "An OPEN change is applied into live YAML and the folder is archived"
      - "A second promote of an already consistent archive is a no-op"
    errors:
      - "Missing slug exits 1 and writes nothing"
      - "promote --ids exits 1 and names accept --ids"
      - "MIXED or PARTIAL exits 1 and writes nothing"
      - "RENAMED or ADDED that the live graph does not already match exits 1 and writes nothing"

implementation:
  dependencies:
    internal: []
    external: []
  depended_on_by:
    components: []
    containers: []
  validation:
    acceptance_criteria:
      - "promote <slug> applies MODIFIED summaries and archives the folder"
      - "A second promote of a consistent archive does not rewrite the live files"
      - "promote --ids is an error that names accept --ids"
      - "MCP catalog does not include promote or accept"
    open_questions: []
    readiness: "ready"
