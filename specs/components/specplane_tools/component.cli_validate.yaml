meta:
  id: "component.cli_validate"
  purpose: "Local validate command: schema, naming, links, changelog, and capability flow shape"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "cli"]
  last_updated: "2026-10-01"
  status: "draft"
  version: "1.4.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-01"
    author: "receipt_next_step"
    summary: "The validate receipt names the error count and says to fix the errors and validate again."
    breaking: false
  - date: "2026-10-01"
    author: "local_command_events"
    summary: "validate completion can append one local command event. Findings stay on stdout."
    breaking: false
  - date: "2026-10-01"
    author: "command_receipts"
    summary: "Prints the validate receipt only when there is at least one error."
    breaking: false
  - date: "2026-09-27"
    author: "kernel-slice"
    summary: "A flow mapping without a non-empty id fails. Strings, and a mapping with an id and no goal, still pass."
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "H02 — MCP does not depend on validate; agents shell out"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Planning + implements for validate CLI; no how"
    breaking: false

implements:
  - "capability.specplane_validate"

uses:
  - "foundation.epistemic_status"
  - "foundation.join_key"
  - "foundation.error_handling"
  - "foundation.observability_standards"

planning:
  user_flows:
    actions:
      - "Point validate at a spec root"
    success:
      - "Valid tree exits 0"
      - "Garbage YAML, id/filename mismatch, or one-sided links exit non-zero with named findings"
      - "A flow mapping without a non-empty id fails. String items, and a mapping with an id and no goal, still pass."
    errors:
      - "Missing spec root → tell how to pass --spec-root"
      - "Unreadable YAML → parse error, not a live graph"

implementation:
  dependencies:
    internal: []
    external: []
  depended_on_by:
    components: []
    containers: []
  validation:
    acceptance_criteria:
      - "Existing tools/specplane testdata invalid fixtures still fail after this slice is implemented"
      - "A flow mapping without a non-empty id fails. String items, and a mapping with an id and no goal, still pass."
      - "Does not stamp epistemic live"
      - "The validate receipt names the error count and says to fix the errors and validate again. Zero errors print no line."
      - "validate completion can append one local command event. Findings stay on stdout."
    open_questions:
      - "Exact stdout/exit-code table is Build Pack work after examination"
    readiness: "unknown"
