meta:
  id: "component.mcp_stdio"
  purpose: "Local stdio MCP: retrieve, blast, impact, check_sync, list_gaps, run — not a product SKU"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "mcp"]
  last_updated: "2026-09-25"
  status: "draft"
  version: "1.5.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-09-25"
    author: "kernel-slice"
    summary: "Catalog adds impact. Same kernel function as the CLI. No infer, specify, or implement tool."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "No reconcile tool. reconcile is CLI-only, like validate and promote."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Still no infer tool. promote is CLI-only, like validate."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Catalog adds run; same kernel as CLI; still no infer, specify, or implement; validate stays CLI-only"
    breaking: false
  - date: "2026-09-18"
    author: "kernel-slice"
    summary: "Thin stdio MCP wraps kernel retrieve/blast/check_sync/list_gaps; validate remains CLI-only"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "H02 — MCP is four tools; validate is CLI only; agents shell out for validate"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Planning + implements for stdio MCP socket; wraps CLI; not hosted"
    breaking: false

implements:
  - "capability.specplane_retrieve"
  - "capability.specplane_blast"
  - "capability.specplane_check_sync"
  - "capability.specplane_list_gaps"
  - "capability.specplane_run"

uses:
  - "foundation.epistemic_status"
  - "foundation.join_key"
  - "foundation.error_handling"
  - "foundation.observability_standards"

planning:
  user_flows:
    actions:
      - "Agent calls retrieve / blast / impact / check_sync / list_gaps / run via MCP instead of reading specs/"
      - "Agent shells out for validate, promote, and reconcile — not MCP tools"
    success:
      - "Same answers as the CLI for retrieve, blast, impact, check_sync, list_gaps, and run (one kernel)"
    errors:
      - "Do not add specify/implement tools"
      - "Do not add infer"
      - "Do not add promote"
      - "Do not add reconcile"
      - "Do not add open_delta as a personality — the folder is the write path"

implementation:
  dependencies:
    internal:
      - "component.cli_retrieve"
      - "component.cli_blast"
      - "component.cli_check_sync"
      - "component.cli_list_gaps"
      - "component.cli_run"
    external: []
  depended_on_by:
    components: []
    containers: []
  validation:
    acceptance_criteria:
      - "Catalog is exactly retrieve, blast, impact, check_sync, list_gaps, run"
      - "Each tool calls the same kernel function as the CLI"
      - "validate is not in the catalog; agents shell out"
      - "promote is not in the catalog; agents shell out"
      - "reconcile is not in the catalog; agents shell out"
      - "Hosted MCP is out of slice"
    open_questions: []
    readiness: "in-progress"
