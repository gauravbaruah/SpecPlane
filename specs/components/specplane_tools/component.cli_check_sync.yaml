  - "foundation.observability_standards"

planning:
  user_flows:
    actions:
      - "check_sync after an agent edits code against live + open deltas"
    success:
      - "In sync: exit 0"
      - "Named behavior moved, live spec unchanged: fail"
      - "Empty blast on a behavior-changing diff: fail"
