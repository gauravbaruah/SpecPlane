      - "Must not auto-write live"
      - "Must not be invoked as self-grade by the same maker session as the only check"

implementation:
  dependencies:
    internal:
      - "component.cli_retrieve"
      - "component.cli_blast"
    external: []
  depended_on_by:
    components:
      - "component.mcp_stdio"
    containers: []
  validation:
    acceptance_criteria:
      - "Pass when each changed id is named in an open change promise_ids or implements a promised capability"
      - "Fail + DECISION REQUIRED when a changed id has no covering open change"
      - "Fail when a changed id has an empty blast"
      - "Never auto-write live. v1 does not parse source to learn values (e.g. timeout 60)"
    open_questions:
      - "Optional realization.paths file map — later"
    readiness: "ready"
