meta:
  id: "component.cli_check_sync"
  purpose: "Local check_sync command: fail moved named behavior and empty blast"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "cli"]
  last_updated: "2026-10-01"
  status: "draft"
  version: "1.8.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-01"
    author: "receipt_next_step"
    summary: "The sync receipt names uncovered ids, or the run command for declared sensors, or the Phase 1 warning."
    breaking: false
  - date: "2026-10-01"
    author: "local_command_events"
    summary: "check_sync completion can append one local command event. Nonzero is nonzero, not a prevented bug."
    breaking: false
  - date: "2026-10-01"
    author: "command_receipts"
    summary: "Prints the sync receipt."
    breaking: false
  - date: "2026-10-01"
    author: "effective_context"
    summary: "Each sensor row prints evidence and status UNVERIFIED."
    breaking: false
  - date: "2026-09-28"
    author: "eval_papercuts"
    summary: "Changed-file paths are relative to the repo, then to the config dir when that dir sits below the git toplevel."
    breaking: false
  - date: "2026-09-28"
    author: "mcp_and_sync_speech"
    summary: "Uncovered failure names the ids and the next commands. No --strict. Still does not stamp live."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Optional realization.paths. Mapped files join the default changed-set. Unmapped app files are advisory. Missing paths do not fail coverage."
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "A — CLI --change <slug>; unknown slug exits non-zero; default remains any-open-change covers"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Q115+Q116 — untracked specs YAML in default set; Phase 1 advisory; linked empty blast still fails"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "v1 check_sync: changed ids vs open change coverage; empty blast fails; does not parse source"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Planning + implements for check_sync CLI; no how"
    breaking: false

implements:
  - "capability.specplane_check_sync"

uses:
  - "foundation.epistemic_status"
  - "foundation.join_key"
  - "foundation.error_handling"
  - "foundation.observability_standards"

planning:
  user_flows:
    actions:
      - "check_sync --change after an agent edits code against live + that open delta"
    success:
      - "In sync: exit 0"
      - "Named behavior moved, live spec unchanged: fail"
      - "Empty blast on a linked id: fail; Phase 1 (no join edges): advisory, exit 0"
    errors:
      - "Must not auto-write live"
      - "Must not be invoked as self-grade by the same maker session as the only check"

implementation:
  dependencies:
    internal:
      - "component.cli_retrieve"
      - "component.cli_blast"
    external: []
  depended_on_by:
    components:
      - "component.mcp_stdio"
    containers: []
  validation:
    acceptance_criteria:
      - "Pass when each changed id is named in an open change promise_ids or implements a promised capability"
      - "Fail + DECISION REQUIRED when a changed id has no covering open change"
      - "Fail when a changed id has join edges and an empty blast"
      - "Phase-1-shaped id: phase1_advisory, exit 0 (not uncovered / empty_blast fail)"
      - "Default changed-set includes untracked specs/**/*.yaml; skips specs/changes/"
      - "Default changed-set also includes a component id when a changed file matches implementation.realization.paths. --changed-ids does not add those ids."
      - "An unmapped changed app file is advisory and does not fail coverage. A missing declared path does not fail coverage and is not deleted."
      - "A changed file path is relative to the repo, then to the config dir when that dir sits below the git toplevel, before it is matched to realization.paths."
      - "Optional --change <slug> scopes coverage to that folder; unknown slug exits non-zero; default without --change remains any-open-change"
      - "Never auto-write live. Does not parse source to learn values (e.g. timeout 60)"
      - "Uncovered failure prints retrieve, open or extend the change folder, and check_sync again. No --strict flag."
      - "Each sensor row prints evidence and status UNVERIFIED. check_sync does not run the bind."
      - "The sync receipt names uncovered ids and says to put them on an open change, or names the run command for declared sensors, or says a Phase 1 empty impact list is a warning."
      - "check_sync completion can append one local command event. Nonzero is nonzero, not a prevented bug."
    open_questions: []
    readiness: "ready"
