meta:
  id: "component.cli_init"
  purpose: "Local init command: copy kit into dest, empty specs/ folders, append AGENTS.md"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "init"]
  last_updated: "2026-10-02"
  status: "draft"
  version: "1.7.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-02"
    author: "specplane_package"
    summary: "specplane uninstall removes the kit copy, leaves specs/ in place, and refuses this SpecPlane checkout. It does not remove the specplane command."
    breaking: false
  - date: "2026-09-28"
    author: "init_journey"
    summary: "The init command follows the init_product_repo journey. A failed copy names the kit folders. --force keeps specs/ and clears generated .specplane/view/."
    breaking: false
  - date: "2026-09-28"
    author: "viewer_projections"
    summary: "The copied CLI includes view.py and the viewer/ tree. --kit-only skips both."
    breaking: false
  - date: "2026-09-25"
    author: "kernel-slice"
    summary: "CLI_FILES and the wheel bundle include impact.py"
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "Consuming AGENTS.md template POST also calls run --change; run invokes bound checks only and does not certify behavior"
    breaking: false
  - date: "2026-09-24"
    author: "kernel-slice"
    summary: "A — consuming AGENTS.md template states PRE retrieve / POST check_sync --change --changed-ids"
    breaking: false
  - date: "2026-09-18"
    author: "kernel-slice"
    summary: "Kit root is the SpecPlane checkout if present, else bundled _specplane_kit in the wheel"
    breaking: false
  - date: "2026-09-17"
    author: "kernel-slice"
    summary: "Planning + implements for cli.py init; no how beyond copy rules"
    breaking: false

implements:
  - "capability.specplane_init"

uses:
  - "foundation.error_handling"

planning:
  user_flows:
    flow_ref: init_product_repo
    actions:
      - "Point init at a destination repo; kit root is the SpecPlane checkout, or the bundled kit in a wheel install"
    success:
      - "Kit, skills, rules, optional CLI, specplane.config.json, AGENTS.md, empty specs/ dirs"
      - "Kernel specs/ from the clone are absent in dest"
    errors:
      - "Dest is the kit root → exit 1"
      - "Dest already has specplane/ and no --force → exit 1"
  validation:
    acceptance_criteria:
      - "Tests assert kit copied, kernel specs not copied, empty dirs, AGENTS append, no .github/workflows"
      - "Consuming AGENTS.md template states PRE retrieve / POST check_sync --change --changed-ids, then run --change. run invokes bound checks only and does not certify behavior."
      - "Does not stamp epistemic live"
      - "Copied CLI files include impact.py, view.py, and the viewer/ tree. --kit-only copies neither."
      - "A failed copy exits 1, names the kit folders to delete, and leaves specs/ in place."
      - "--force keeps existing spec YAML, drops a kit file the new copy no longer has, and deletes generated .specplane/view/."
      - "specplane uninstall removes the kit copy, leaves specs/ in place, and refuses this SpecPlane checkout. It does not remove the specplane command."
    open_questions: []
    readiness: "in-progress"

implementation:
  dependencies:
    internal: []
    external: []
  depended_on_by:
    components: []
    containers: []
