meta:
  id: "component.cli_view"
  purpose: "Local view command: generate the readout and serve it on 127.0.0.1"
  level: "component"
  type: "service"
  domain: "infrastructure"
  owner: "SpecPlane"
  tags: ["kernel", "cli", "viewer"]
  last_updated: "2026-10-05"
  status: "draft"
  version: "1.6.0"
  review_state: "unreviewed"
  introduced_in: "1.0.0"

changelog:
  - date: "2026-10-05"
    author: "oss_hygiene"
    summary: "The generated site does not include logo.png. The header is the word SpecPlane. The readout stays on 127.0.0.1."
    breaking: false
  - date: "2026-10-02"
    author: "usage_report"
    summary: "The viewer describes usage status, show, enable, disable, and report. Older telemetry events still have descriptions. The seven-day GitHub notice and the star request stay."
    breaking: false
  - date: "2026-10-02"
    author: "telemetry_share"
    summary: "Activity counts this project on this machine. After 7 days the page asks the person to paste the summary on a new GitHub issue. After 2 days it asks for a star. No email address is shown. Nothing is posted."
    breaking: false
  - date: "2026-10-01"
    author: "activity_command_help"
    summary: "The Activity page is a table. OK and nonzero each have their own ?. A missing caller label is shown as unattributed, not as a failed check."
    breaking: false
  - date: "2026-10-01"
    author: "viewer_activity"
    summary: "Activity summarizes the local command log for the last 30 days. Copy summary copies those sentences and does not open a network connection."
    breaking: false
  - date: "2026-10-01"
    author: "viewer_change_states"
    summary: "The readout marks each change in-flight or archived. A folder under specs/changes/_archive stays out of the kernel open-change list."
    breaking: false
  - date: "2026-09-28"
    author: "viewer_projections"
    summary: "specplane view generates the local readout and serves it. It is not an MCP tool."
    breaking: false

implements:
  - "capability.specplane_viewer"
  - "capability.specplane_telemetry_share"

uses:
  - "foundation.design_system"
  - "foundation.observability_standards"

planning:
  user_flows:
    actions:
      - "specplane view"
      - "specplane view --open"
      - "specplane view --out DIR"
    success:
      - "Pages are generated and a 127.0.0.1 URL is printed"
      - "The generated site does not include logo.png. The header is the word SpecPlane"
      - "An inferred id is not given a live slice"
    errors:
      - "Must not bind 0.0.0.0"
      - "Must not write generated HTML under specs/"
      - "Must not load Mermaid from a CDN"

implementation:
  realization:
    paths:
      - "tools/specplane/view.py"
      - "tools/specplane/viewer/"
  dependencies:
    internal: []
    external: []
  depended_on_by:
    components: []
    containers: []
  validation:
    acceptance_criteria:
      - "A declared diagram is rendered by the vendored Mermaid. Map, Blast, Layers, Journey, and Data stay cards and curves"
      - "Blast columns follow impact distance. Distance 3 and beyond stays collapsed until expand"
      - "The gaps lens matches list_gaps"
      - "Each change in the readout is in-flight or archived. A folder under specs/changes/_archive is archived and is not an open kernel change."
      - "Activity counts this project on this machine for the last 30 days. Events with no project attribution are omitted. The description is visible. OK and nonzero each have their own ?. A missing caller label is shown as unattributed, not as a failed check. Copy summary copies the counts and does not open a network connection. After 7 days the page links a new GitHub issue. After 2 days it links the repository and asks for a star. The page shows no email address. The page refreshes when that log is newer than the payload."
      - "The Activity table describes usage status, usage show, usage enable, usage disable, and usage report. Older telemetry events still have descriptions."
    open_questions: []
    readiness: "ready"
