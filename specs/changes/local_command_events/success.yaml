change_id: "local_command_events"
kind: "learn"

sensors:
  - id: "on-by-default"
    promise: "foundation.observability_standards"
    must: "With no telemetry setting, a CLI command appends one local event and still uploads nothing."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_default_writes_an_event"
  - id: "disable-writes-nothing"
    promise: "foundation.observability_standards"
    must: "SPECPLANE_TELEMETRY=0 writes no event file."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_disabled_writes_nothing"
  - id: "no-spec-id-in-event"
    promise: "foundation.observability_standards"
    must: "An enabled command event does not contain the spec id it was asked about."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_enabled_event_omits_spec_id"
  - id: "caller-allowlist"
    promise: "foundation.observability_standards"
    must: "A caller value outside the allowlist is stored as unknown, not as the raw string."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_bad_caller_is_unknown"
  - id: "write-failure-keeps-exit"
    promise: "component.cli_validate"
    must: "If the event write fails, the command exit code is unchanged."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_emit_failure_keeps_exit_code"

looks_fine_is_not_a_sensor: true
