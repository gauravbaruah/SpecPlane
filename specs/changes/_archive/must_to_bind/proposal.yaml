id: "must_to_bind"
kind: "evolve"
status: "promoted"
opened: "2026-10-05"
promise_ids:
  - "capability.specplane_init"
  - "component.cli_init"
why: >-
  Agents already call run --change, leave must: unbound, and treat POST as done.
  The join already exists: must: is the claim, and run.unittest or run.argv
  binds a check the user already owns. This evolve is that reminder on the
  surfaces an agent already loads. Consuming AGENTS and the implement POST
  say to bind an existing check, not to invent a test, and not to parse
  test_strategy. Unbound must: stays not_run.
non_goals:
  - "a specplane-bind skill"
  - "a best-practices document"
  - "verify.runner or new YAML test types"
  - "failing run when every row is not_run"
  - "changing check_sync unbound exit policy"
  - "parsing test_strategy into a command"
  - "kernel run or check_sync code, schema, or new CLI flags"
  - "dispatching affected MUSTs across a blast"
