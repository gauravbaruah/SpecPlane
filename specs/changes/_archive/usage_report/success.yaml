id: "usage_report"
sensors:
  - id: "report_omits_identifiers"
    promise: "capability.specplane_telemetry_share"
    must: "usage report prints counts for the last 30 days. The printout has no installation id, project id, path, timestamp, or spec name, and it says nothing is sent."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_usage_report_omits_identifiers"
  - id: "usage_is_the_command"
    promise: "foundation.observability_standards"
    must: "usage status says whether the local log is on and that upload is never. telemetry status is an alias and records the command as usage."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_telemetry_alias_records_usage"
  - id: "disable_still_writes_nothing"
    promise: "foundation.observability_standards"
    must: "SPECPLANE_TELEMETRY=0 still keeps a command from writing an event."
    run:
      unittest: "tools.specplane.test_telemetry.TelemetryTests.test_disabled_writes_nothing"

looks_fine_is_not_a_sensor: true
