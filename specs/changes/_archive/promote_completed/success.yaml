change_id: "promote_completed"
kind: "evolve"

sensors:
  - id: "promoted_specs_validate"
    promise: "capability.specplane_check_sync"
    must: "The live spec root still validates after the accepted deltas land"
    run:
      argv:
        - "python3"
        - "tools/specplane/cli.py"
        - "validate"
        - "--spec-root"
        - "specs"

looks_fine_is_not_a_sensor: true
