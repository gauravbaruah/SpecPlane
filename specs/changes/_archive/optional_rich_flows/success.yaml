id: "optional_rich_flows"
sensors:
  - id: "string_flows_still_valid"
    promise: "capability.specplane_list_gaps"
    must: "A capability with only string flows still validates"
  - id: "mapping_flow_optional_keys"
    promise: "capability.specplane_list_gaps"
    must: "A capability with one mapping flow (id + goal) and omitted lifecycle/information still validates"
  - id: "flows_skill_does_not_invent"
    promise: "capability.specplane_list_gaps"
    must: "specplane-flows tells the agent not to invent unanswered lifecycle behavior"
  - id: "init_lists_flows_skill"
    promise: "capability.specplane_init"
    must: "Consuming AGENTS skill list includes specplane-flows"
  - id: "schema_optional_not_required"
    promise: "capability.specplane_list_gaps"
    must: "Schema says not every file needs journey + lifecycle + information"
