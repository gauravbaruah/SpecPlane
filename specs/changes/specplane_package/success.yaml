id: "specplane_package"
sensors:
  - id: "four_flows_four_diagrams"
    promise: "capability.specplane_package"
    must: "The package capability has four journey flows and one diagram whose title names each flow."
  - id: "clean_install_can_init"
    promise: "capability.specplane_package"
    must: "A clean environment can install specplane and init a destination that has the kit and lacks this repo's kernel specs."
  - id: "install_is_quiet"
    promise: "capability.specplane_package"
    must: "Install does not show a consent dialog, does not write an agent host configuration, and does not upload."
  - id: "checkout_still_installs"
    promise: "capability.specplane_package"
    must: "pip install -e . from a SpecPlane checkout still provides the specplane command, and uvx --from git+ this repo can still run init."
  - id: "init_sentence"
    promise: "capability.specplane_init"
    must: "Live init says a published specplane package may run init, init does not publish, and there is no npx package."

looks_fine_is_not_a_sensor: true
