id: "specplane_package"
kind: "evolve"
status: "in-flight"
opened: "2026-10-01"
promise_ids:
  - "capability.specplane_package"
  - "capability.specplane_init"
  - "component.cli_init"
why: >-
  The CLI is already built as a wheel and can init from a git install.
  A published specplane package is how a developer obtains that command
  without cloning this repo. Install stays non-interactive. The local
  command log stays as it is, and nothing is uploaded.
non_goals:
  - "an install-time consent dialog"
  - "writing Cursor, Claude, or Codex configuration"
  - "hosted telemetry upload"
  - "splitting execution status from SpecPlane outcome"
  - "an npx package"
  - "removing the specplane command from the machine"
  - "changing what specplane init copies"
