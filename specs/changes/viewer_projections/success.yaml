change_id: "viewer_projections"
kind: "learn"

sensors:
  - id: "inferred_not_live"
    promise: "capability.specplane_viewer"
    must: "An inferred id stays inferred and is not given a live slice"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_inferred_is_not_live"
  - id: "diagram_scroll"
    promise: "capability.specplane_viewer"
    must: "Map, Blast, Layers, and Diagrams stay in the column. The page scrolls. Nothing captures the wheel to zoom."
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_diagrams_scroll_in_the_column"
  - id: "blast_hops"
    promise: "capability.specplane_viewer"
    must: "Blast columns follow impact distance. Distance 3 and beyond stays collapsed until expand."
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_affected_hops_are_distances"
  - id: "affected_path"
    promise: "capability.specplane_viewer"
    must: "An affected id carries the kernel path that included it"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_affected_path_comes_from_impact"
  - id: "gaps_match"
    promise: "capability.specplane_list_gaps"
    must: "The gaps lens matches list_gaps"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_gaps_match_list_gaps"
  - id: "no_negative_claim"
    promise: "capability.specplane_viewer"
    must: "The viewer does not say no security impact, no QA required, no compliance impact, or no owner required"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_no_negative_security_claim"
  - id: "projection_switcher"
    promise: "capability.specplane_viewer"
    must: "Sequence is not its own tab. Diagrams and Data appear when that record's payload contains them, and stay absent when it does not"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_projection_switcher"
  - id: "design_system_tokens"
    promise: "foundation.design_system"
    must: "The viewer uses the design-system families and semantic colors, and ships the font files instead of calling a font service"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_design_system_tokens_are_local"
  - id: "delta_lines"
    promise: "capability.specplane_viewer"
    must: "A delta mapping shows its id and summary. A grouped delta shows the group and the sentence. Neither is printed as a raw mapping."
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_delta_lines_keep_id_and_summary"
  - id: "payload_refresh"
    promise: "capability.specplane_viewer"
    must: "A reload rebuilds the payload when a change folder appears after generation"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_payload_refreshes_when_spec_root_changes"
  - id: "design_time_change"
    promise: "capability.specplane_viewer"
    must: "A change with why and promise ids and no delta still has an impact path"
    run:
      unittest: "tools.specplane.test_view.ViewerModelTests.test_design_time_change"
