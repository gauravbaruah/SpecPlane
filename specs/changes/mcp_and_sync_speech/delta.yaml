      unknown ids, empty blast, and Phase 1 advisory keep their existing lines
      and do not get that recipe. No --strict. Still does not stamp live.
  - id: "component.cli_check_sync"
    summary: >-
      The check_sync command prints the same recipe. No new flag.
  - id: "component.mcp_stdio"
    summary: >-
      cli.py mcp calls mcp_stdio.serve(). Catalog stays retrieve, blast,
      impact, check_sync, list_gaps, run. A per-call spec_root still wins.

