change_id: "ci_compose"
kind: "evolve"

sensors:
  - id: "skip_skill_spec_edit_fails"
    promise: "capability.specplane_check_sync"
    must: "A spec edit with no covering open change fails the gate, and check_sync does not execute sensors"
    run:
      unittest: "tools.specplane.test_ci_gate.CiGateTests.test_skip_skill_spec_edit_fails"
  - id: "cooperating_change_runs"
    promise: "capability.specplane_run"
    must: "A change folder in the diff also runs check_sync --change and run --change"
    run:
      unittest: "tools.specplane.test_ci_gate.CiGateTests.test_cooperating_change_runs"
  - id: "init_does_not_write_workflow"
    promise: "capability.specplane_init"
    must: "Init still does not write a workflow, and the docs call the gate a paste rather than a required check"
    run:
      unittest: "tools.specplane.test_ci_gate.CiGateTests.test_init_does_not_write_workflow"

looks_fine_is_not_a_sensor: true
