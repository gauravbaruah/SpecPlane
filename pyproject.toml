[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["packaging"]

[project]
name = "specplane"
version = "0.1.0"
description = "Keep coding agents aligned with what you actually meant to build."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["setuptools>=68"]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/gauravbaruah/SpecPlane"

[project.scripts]
specplane = "cli:main"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "tools/specplane" }
py-modules = ["cli", "kernel", "validate", "initkit", "mcp_stdio", "drift"]
packages = ["_specplane_kit"]

[tool.setuptools.package-data]
_specplane_kit = ["**/*", "**/.*", ".agents/**/*", ".cursor/**/*"]
