[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specplane"
version = "0.1.0"
description = "Keep coding agents aligned with what you actually meant to build."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/gauravbaruah/SpecPlane"

[project.scripts]
specplane = "cli:main"

[tool.setuptools]
package-dir = { "" = "tools/specplane" }
py-modules = ["cli", "kernel", "validate", "initkit", "mcp_stdio", "drift"]
