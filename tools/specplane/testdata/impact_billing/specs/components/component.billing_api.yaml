meta:
  id: component.billing_api
  purpose: "Accept a retry and emit payment_completed"
  level: component
  type: service
  domain: backend
  owner: "Payments Platform"
  version: "1.0.0"
  introduced_in: "1.0.0"
  review_state: unreviewed
  status: draft

changelog:
  - date: "2026-09-25"
    author: "specplane"
    summary: "Impact fixture API"
    breaking: false

implements:
  - capability.billing

uses:
  - foundation.privacy_consent

planning:
  user_flows:
    flow_ref: patient_payment
  analytics:
    success_metric: payment_completion
    events:
      - name: payment_completed
        when: "retry succeeds"

implementation:
  realization:
    paths:
      - services/billing_api.py
  contracts:
    apis:
      - "POST /v1/billing/retry"
    data_models:
      RetryRequest:
        fields: [invoice_id, instrument_id]
      PaymentResult:
        fields: [status, invoice_id]
  dependencies:
    internal:
      - component.invoice_worker
      - component.payment_store
    external: []
  depended_on_by:
    components: []
    containers: []
  observability:
    metrics:
      - billing_retry_total
  technical_constraints:
    security:
      data_classification: regulated
      data_protection: "PAN is not written to retry logs"
      compliance: "PCI-DSS"
  validation:
    acceptance_criteria:
      - "A declined charge can be retried once"
    test_strategy:
      unit: "cover decline and successful retry"
      e2e: ""
      performance: false
      security: "PAN is absent from retry logs"
  rollout:
    strategy: canary
    rollback_trigger: "billing_retry_total errors above 1% for 5 minutes"
